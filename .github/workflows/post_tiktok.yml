name: Horror Reels Bot (TikTok)

# Mirrors post.yml (Facebook) exactly for setup steps -- deliberately
# a SEPARATE workflow file rather than a conditional branch inside
# post.yml, so a TikTok-specific failure (or the extra
# persist-credentials step) can never affect the Facebook schedule,
# and vice versa.
#
# This directly resolves the "confirm whatever triggers the automated
# run actually passes --platform tiktok" open item from the Phase 2
# handoff doc -- this file is that trigger, explicit.

on:
  schedule:
    - cron: '0 12 * * *'  # 8PM PHT daily (12PM UTC = 8PM UTC+8) --
                            # offset by an hour from post.yml's 7PM
                            # Facebook post so the two never overlap
                            # on the same runner minute.
  workflow_dispatch:         # Manual trigger for testing

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pynacl is NEW here vs post.yml -- only needed by
        # scripts/persist_tiktok_credentials.py's sealed-box
        # encryption step, not by the pipeline itself.
        run: pip install requests Pillow edge-tts pyyaml pynacl

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Lora font
        run: |
          mkdir -p brands/horror_lab/assets/fonts
          curl -L "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" \
            -o brands/horror_lab/assets/fonts/Lora-Italic.ttf

      - name: Run horror reels bot (TikTok)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          HORROR_LAB_TIKTOK_REFRESH_TOKEN: ${{ secrets.HORROR_LAB_TIKTOK_REFRESH_TOKEN }}
        run: python -m core.pipeline.cli --brand horror_lab --platform tiktok --db-path horror_log.db

      - name: Persist refreshed TikTok credentials
        # always(): a token refresh can succeed even when the publish
        # call right after it fails (see TikTokProvider's docstring on
        # refreshed_credentials being returned even on downstream
        # failure) -- that refreshed pair still needs saving, so this
        # step must run regardless of the previous step's exit code.
        if: always()
        # continue-on-error: a failure HERE (e.g. GH_SECRETS_PAT
        # expired) is reported loudly (script exits 1, prints to
        # stderr) but shouldn't mark the whole job failed -- the video
        # was already generated/published (or not) by the previous
        # step regardless of this step's outcome. Watch the Actions
        # log for this step's WARNING/error output; a red X here still
        # needs a human, it's just not conflated with "the post
        # itself failed."
        continue-on-error: true
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          # GH_SECRETS_PAT is a fine-grained PAT scoped to ONLY this
          # repo, with Repository permissions -> Secrets: "Read and
          # write" and nothing else -- see
          # scripts/persist_tiktok_credentials.py's module docstring
          # for the exact minimum-permission checklist and why it
          # can't be scoped any narrower than that.
        run: python scripts/persist_tiktok_credentials.py

      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-log-tiktok
          path: horror_log.db
          retention-days: 30
