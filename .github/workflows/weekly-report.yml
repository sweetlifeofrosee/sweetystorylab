name: Weekly Performance Report

# Deliberately isolated from post.yml / post_mystery.yml: separate
# trigger, separate job, no shared steps, no credentials of any kind
# (V1 is repository-first -- see scripts/report/__init__.py and the
# Architecture and Development Guide §14.2, §14.5). This workflow
# cannot affect, and does not run in the same job as, either brand's
# generation/posting pipeline.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write   # only to commit the rendered report itself

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Full history is required: scripts/report/git_history.py
          # derives weekly deltas from used_subjects.json's own commit
          # history (see that module's docstring). A shallow clone
          # would silently under-report activity.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate weekly report
        run: python -m scripts.report.run_weekly_report

      - name: Commit report
        run: |
          if [ -n "$(git status --porcelain reports/weekly)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/weekly
            git commit -m "Weekly Performance Report [skip ci]"
            git push
          else
            echo "No changes to reports/weekly, skipping commit."
          fi
