name: Mystery Reels Bot

on:
  schedule:
    - cron: '0 23 * * *'  # 7AM PHT daily (23:00 UTC = 7AM UTC+8)
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write
  
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow edge-tts pyyaml

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Playfair Display font
        # Matches brands/mystery_lab/config.yaml's branding.font value
        # (assets/fonts/PlayfairDisplay-Regular.ttf) and branding.font_source_url.
        # run.py resolves both the same way: os.path.join(brand_dir, config.<field>).
        run: |
          mkdir -p brands/mystery_lab/assets/fonts
          curl -L "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" \
            -o brands/mystery_lab/assets/fonts/PlayfairDisplay-Regular.ttf

      - name: Run mystery reels bot
        env:
          MYSTERY_LAB_FB_PAGE_ACCESS_TOKEN: ${{ secrets.MYSTERY_LAB_FB_PAGE_ACCESS_TOKEN }}
          MYSTERY_LAB_FB_PAGE_ID: ${{ secrets.MYSTERY_LAB_FB_PAGE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m core.pipeline.cli --brand mystery_lab --db-path mystery_log.db

      - name: Persist used_subjects.json
        run: |
          if [ -n "$(git status --porcelain brands/mystery_lab/used_subjects.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add brands/mystery_lab/used_subjects.json
            git commit -m "Update mystery_lab used_subjects.json [skip ci]"
            git push
          else
            echo "No changes to used_subjects.json, skipping commit."
          fi

      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-log
          path: mystery_log.db
          retention-days: 30