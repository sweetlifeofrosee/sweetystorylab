name: Horror Reels Bot

on:
  schedule:
    - cron: '0 11 * * *'  # 7PM PHT daily (11AM UTC = 7PM UTC+8)
  workflow_dispatch:        # Manual trigger for testing

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pyyaml is NEW -- required by core/config/loader.py to read
        # brand config.yaml files. Everything else matches the
        # original exactly (no MusicGen/HuggingFace deps -- that
        # subsystem never existed in the real pipeline).
        run: pip install requests Pillow edge-tts pyyaml

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Lora font
        # CHANGED: destination now matches the unified brand-asset
        # convention (assets/fonts/, assets/sounds/) -- run.py resolves
        # both the same way: os.path.join(brand_dir, config.<field>).
        run: |
          mkdir -p brands/horror_lab/assets/fonts
          curl -L "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" \
            -o brands/horror_lab/assets/fonts/Lora-Italic.ttf

      - name: Run horror reels bot
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        # CHANGED: was `python post.py`. Same secrets, same names --
        # zero changes needed to your GitHub secrets.
        run: python -m core.pipeline.cli --brand horror_lab --db-path horror_log.db

      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-log
          path: horror_log.db
          retention-days: 30