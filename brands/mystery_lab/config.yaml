brand:
  id: mystery_lab
  name: "Mystery Lab"
  emoji: "📜"
  parent: sweetystorylab

content:
  system_prompt_file: prompts/system_prompt.txt
  user_prompt_file: prompts/user_prompt.txt
  parser_module: brands.mystery_lab.parser.MysteryLabParser
  fallback_provider_module: brands.mystery_lab.fallback.MysteryLabFallbackProvider
  dedup_module: brands.mystery_lab.dedup.MysteryLabSubjectDeduplicator
  # Identical to Horror Lab's segment_template, deliberately -- this is
  # the actual validation point: a second brand reusing the exact same
  # schema, proving it's genuinely generic rather than horror-shaped.
  segment_template:
    - narration_scene
    - narration_scene
    - narration_scene
    - question_slide

llm:
  model: llama-3.3-70b-versatile
  # Lower than Horror Lab's 0.95 -- Mystery Lab's system prompt places
  # hard structural demands on fact/theory discipline; slightly less
  # creative variance reduces the risk of drifting off that structure.
  # A judgment call, not a default -- revisit by ear once live output
  # is reviewed.
  temperature: 0.85
  max_tokens: 1200

voice:
  default_profile: male
  profiles:
    male:
      edge_tts_voice: en-US-ChristopherNeural
      elevenlabs_preferred: ["Daniel", "Antoni", "Josh", "Arnold"]
    female:
      edge_tts_voice: en-US-JennyNeural
      elevenlabs_preferred: ["Rachel", "Bella", "Dorothy"]

branding:
  # Brand-specific, not the shared "SweetyStoryLab" parent name --
  # the watermark's real job is attribution when a video travels
  # beyond its origin Page (reposts, screen-recordings, etc.), and
  # "Mystery Lab" is an actual followable destination; "SweetyStoryLab"
  # is not (no public page exists under that name today). Revisit if
  # SweetyStoryLab ever gains its own public presence worth recognizing.
  watermark_text: "Mystery Lab"
  font: assets/fonts/PlayfairDisplay-Regular.ttf
  font_source_url: "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"

music:
  local_file: assets/sounds/investigative.mp3

image:
  style_suffix: "muted documentary photography, archival tone, desaturated color, soft natural light, photorealistic, no text, no watermark, no faces"
  fallback_dir: "images"
  # Muted sepia/parchment tone, not Horror Lab's near-black -- even a
  # total-failure fallback frame should read as "archive," not "horror."
  fallback_color: [60, 50, 35]

# New Facebook Page -> new secret names required. Until
# MYSTERY_LAB_FB_PAGE_ID / MYSTERY_LAB_FB_PAGE_ACCESS_TOKEN exist as
# GitHub secrets, the pipeline correctly runs in dry-run mode -- this
# is expected, not a bug, until those secrets are added.
question:
  # Explicit, matching the shared renderer default -- kept unchanged
  # by this Horror Lab-only refinement request.
  max_font_size: 117
  text_color: [198, 156, 84]  # warm gold -- Mystery Lab's brand identity

facebook:
  page_id_env: MYSTERY_LAB_FB_PAGE_ID
  access_token_env: MYSTERY_LAB_FB_PAGE_ACCESS_TOKEN

schedule:
  times_pht: []   # scheduling stays external, in GitHub Actions cron